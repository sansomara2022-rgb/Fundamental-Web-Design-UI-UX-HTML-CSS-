<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chio San </title>

  <!-- Icon library (needs internet) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- External CSS -->
  <link rel="stylesheet" href="sty.css">

  <!-- Internal CSS -->
  <style>
    .subtitle {
      margin: 0 0 22px;
      font-size: 12px;
      color: #9a9a9a;
    }
  </style>
</head>
<body>

  <!-- Div container for the card -->
  <div class="card">
    <div class="cover"></div>
     <img src="choi san.jpg" alt="cover picture" class="cover-pic">

      <span class="menu">&#8942;</span>
    <div class="cover"></div>

    <!-- Profile picture with online dot -->
    <div class="avatar">
      <img src="my_boy.jpg" alt="Profile picture" class="profile-pic">
      <span class="online"></span>
    </div>

    <!-- Heading for the name (inline CSS) -->
    <h2 style="font-size: 15px;">Choi San</h2>
    <p class="subtitle"></p>

    <!-- Stats -->
    <div class="stats">
      <div><span>Posts</span><strong>152</strong></div>
      <div><span>Following</span><strong>8</strong></div>
      <div><span>Followers</span><strong>12.2M</strong></div>
    </div>

    <!-- Paragraph for the short bio -->
    <p class="bio">SAN form ATEEZ</p>

    <!-- Social icons -->
    <div class="social">
      <a href="#" class="dot twitter"><i class="fa-brands fa-twitter"></i></a>

      <a href="#" class="dot facebook"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#" class="dot google"><i class="fa-brands fa-google-plus-g"></i></a>
      <a href="#" class="dot instagram"><i class="fa-brands fa-instagram"></i></a>
    
    </div>

    <!-- Button for interaction -->
    <button class="btn">View Profile</button>

  </div>

</body>
</html>
