<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Responsive Navigation Bar </title>
    <style>
        body{
            margin: 100px;
        }
        .page{
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            padding: 0 24px;
            height: 100px;

        }
        /* .topnav {
         overflow: hidden;
            background-color: #333;
        } */
        .topnav .icon {
           float: left;
           display: block;
           color: #f2f2f2;
           text-align: center;
           padding: 14px 16px;
           text-decoration: none;
            font-size: 17px;
        }
        .icon{
            display: none;
        }

        

       

        .topnav .icon {
          display: none;
        }
        @media (max-width:768px) {
           
            .icon{
                float:right;
                display: block;
                

            }
            .topnav {
                display: none;
                position: absolute;
                top: 100px;      
                left: 0;
                width: 100%;
                background: #333;
            }

            
        }

       
        .topnav.responsive .icon {
           float: none;
           display: block;
           text-align: left;
        }




    </style>
</head>
<body>
    <div class="page">
        <div><h1>logo</h1></div>
        <label for="menu-toggle" class="icon">&#9776;</label>

        <div class="topnav" id="myTopnav">
           <a href="#home" class="active">Home</a>
           <a href="#news">News</a>
           <a href="#contact">Contact</a>
           <a href="#about">About</a>
           
           
           
       </div>
    </div>
    
</body>
</html>
